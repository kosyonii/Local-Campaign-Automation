# QC Gate — 팔로워/구독자 기준 (Conversation Stream)
#
# 판정 (quality_control/follower_gate.py)
#   기준 위젯 + 기준 채널이 아니면                -> 해당 없음 (KEEP, 규칙 없음)
#   팔로워/구독자 >= threshold                    -> KEEP (규칙 없음)
#   0 < 팔로워/구독자 < threshold                 -> DROP
#   0 / 빈 값 / 숫자가 아님 / 프로필 없음          -> FLAG  (DROP하지 않음)
#
# 0을 FLAG로 두는 이유: Sprinklr sender_profile.followers가 위젯의 "0-500" 구간 계정뿐 아니라
# 큰 계정(예: apple, Verizon)에도 0을 돌려준다. 0은 "작다"가 아니라 "모름"으로 취급한다.
# (애매하면 포함 / 누락률 1순위)

threshold: 100000

# Raw Data_원문 시트의 'snType column' 값 (대문자)
channels:
  - TWITTER
  - INSTAGRAM
  - YOUTUBE

# 'source_widget' 값이 이 접두어로 시작하는 행에만 적용한다.
# 확인 전: 표(기준표)상 팔로워 100K 기준은 Conversation Stream에만 있는데, 1.2 Reply / 1.3 Repost
# 까지 적용하는지는 위젯 확인 후 결정. 좁게 시작해 DROP이 늘어나지 않게 한다.
widgets:
  - "1.1."

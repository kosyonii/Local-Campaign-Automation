# QC Gate — 파트너 위젯 당사(Samsung 전체) 무관 게시물 (태스크 1, 1차)
#
# 매칭 규칙 (quality_control/partner_gate.py)
#   - NFKC 정규화 후 대소문자 무시
#   - "re:" 접두어: 정규식을 그대로 사용(경계 없음 = 부분 문자열). 붙여 쓴 해시태그
#     (#GalaxyZFold8, #SamsungTV)와 한국어 조사(삼성전자가)를 잡기 위해 핵심 브랜드는 이 방식을 쓴다.
#   - 그 외 용어: 영문/숫자로 시작·끝나면 단어 경계를 적용(Knox가 Knoxville에 걸리지 않게),
#     비라틴 문자는 부분 문자열 일치. 공백은 공백/-/_/. 0개 이상으로 매칭.
#
# 판정 흐름
#   당사 키워드 히트                          -> KEEP (규칙만 기록)
#   키워드 없음 + 본문이 너무 짧음             -> FLAG
#   키워드 없음 + 본문 있음 + llm_drop_channels 밖 -> FLAG (LLM 호출 없음)
#   키워드 없음 + 본문 있음 + llm_drop_channels 안 -> Gemini 텍스트 판정
#       UNRELATED_TO_SAMSUNG + 근거 검증 통과  -> DROP
#       그 외 / Gemini 실패 / --no-llm        -> FLAG
#
# 사전은 "DROP을 막는 쪽"에 넉넉하게 유지한다. (애매하면 포함 / 누락률 1순위)
# 범위는 "Samsung 전체"(모바일 한정 아님). 이 사전에 걸리면 무조건 KEEP이므로 넓을수록 안전하다.

# 'source_widget' 값이 이 접두어로 시작하는 Raw Data_원문 행에만 적용한다.
widgets:
  - "3."

# 키워드가 없을 때 Gemini 텍스트 판정으로 DROP할 수 있는 채널('snType column' 값, 대문자).
# 그 외 채널(IG / YT / TT)은 본문이 약하고 영상·이미지에 삼성이 나올 수 있어서(예: 본문에 삼성이
# 없는데 수기 검수에서 남긴 Singtel YT 영상) LLM을 호출하지 않고 FLAG한다. (누락률 1순위)
llm_drop_channels:
  - TWITTER

# 본문이 이 길이(URL·공백 제외) 미만이면 LLM에 보내지 않고 FLAG한다.
min_text_chars: 3

samsung_terms:
